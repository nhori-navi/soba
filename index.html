const visitOf=id=>D.visits.find(v=>v.id===id);
const byDate=(a,b)=>(b.date||'').localeCompare(a.date||'')||(b.at||0)-(a.at||0);
const ends=v=>{const s=shopOf(v.shop);return v.origin&&v.origin.p&&s&&s.p?[v.origin.p,s.p]:null;};
const lastAt=(shop,notId,beforeDate)=>[...D.visits].filter(v=>v.shop===shop&&v.id!==notId&&(!beforeDate||(v.date||'')<=beforeDate)).sort(byDate)[0]||null;

const state={tab:'rec',shop:null,visit:null,picking:false};
let map=null,marker=null,ready=false,run=0;
const say=(v,k)=>v?AXIS[k].x[v[0]]+'、'+AXIS[k].y[v[1]]:'未記入';
const px=v=>10+20*v[0],py=v=>10+20*(4-v[1]);

/* ---------- 下の画面 ---------- */
function drawTabs(){
  $('tabs').innerHTML=[['rec','記録'],['mise','お店'],['back','控え']].map(([k,t])=>`<button type="button" data-k="${k}" aria-pressed="${state.tab===k}">${t}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(state.visit)leaveVisit();state.tab=b.dataset.k;render();$('pane').scrollTop=0;});
}
function render(){drawTabs();if(state.visit&&visitOf(state.visit))return drawVisit();if(state.tab==='rec')drawRec();else if(state.tab==='mise')drawMise();else drawBack();}
function miniSvg(k,list,only){
  const cell={};
  list.forEach(r=>{const v=r[k];if(!v)return;const c=v.join();(cell[c]=cell[c]||{v,n:0,yes:0}).n++;if(r.again===2)cell[c].yes++;});
  const a=AXIS[k],dots=Object.values(cell).map(o=>`<circle class="${o.yes||only?'m-on':'m-off'}" cx="${px(o.v)}" cy="${py(o.v)}" r="${only?7:3.5+o.n*2.2}"/>`).join('');
  return `<div class="mini ${k}"><div class="ax up">${a.up}</div><svg viewBox="0 0 100 100" role="img" aria-label="${a.name}の記録の分布"><line class="mid" x1="50" y1="0" x2="50" y2="100"/><line class="mid" x1="0" y1="50" x2="100" y2="50"/>${dots}</svg><div class="ax low"><span>${a.low[0]}</span><span>${a.low[2]}</span></div></div>`;
}
/* 店頭画面：前回何を食べてどうだったか、値段の動き、店の情報をひと目で */
function frontHtml(s,list){
  const last=list[0],rows=[],web=n=>(s.web||[]).filter(w=>w.n===n);
  if(last){
    rows.push(['前回',md(last.date)+(last.dish?'　'+last.dish:'')]);
    if(last.again!=null)rows.push(['次の気持ち',AGAIN[last.again]]);
    if(last.soba)rows.push(['そば',say(last.soba,'soba')]);
    if(last.tsuyu)rows.push(['つゆ',say(last.tsuyu,'tsuyu')]);
    if(last.origin)rows.push(['産地',last.origin.name]);
    const pr=list.filter(v=>v.price);
    if(pr.length){let t=pr[0].price.toLocaleString()+'円';if(pr[1]&&pr[1].price!==pr[0].price)t+=`（その前より${pr[0].price>pr[1].price?'+':'−'}${Math.abs(pr[0].price-pr[1].price).toLocaleString()}円）`;rows.push(['値段',t]);}
  }
  const closed=web('定休日').concat(web('営業時間'));
  const mine=s.mine||{},feel=[...(mine.look||[]),...(mine.size||[]),...(mine.seat||[])].join('、');
  return `<section class="front" id="front"><h2>${esc(s.name)}</h2>
    ${rows.length?`<dl class="dl">${rows.map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>`:'<p class="note">まだ記録がありません。</p>'}
    ${closed.length?`<dl class="dl">${closed.map(w=>`<dt>${esc(w.n)}</dt><dd>${esc(w.v)}${old(w.date)?'<span class="warn">確認から1年以上たっています</span>':''}</dd>`).join('')}</dl>`:''}
    ${feel?`<p class="note">${esc(feel)}</p>`:''}
    <p class="note">記録${list.length}件</p>
    <button class="link" id="frontInfo" type="button">お店の情報を見る</button></section>`;
}
function drawRec(){
  const list=D.visits.filter(v=>!state.shop||v.shop===state.shop).sort(byDate);
  const shops=[...D.shops].sort((a,b)=>a.at-b.at);
  $('view').innerHTML=`
    ${state.shop&&shopOf(state.shop)?frontHtml(shopOf(state.shop),list):''}
    ${shops.length?`<div class="chips" id="fil"><button class="chip" type="button" data-k="" aria-pressed="${!state.shop}">すべて</button>${shops.map(s=>`<button class="chip" type="button" data-k="${esc(s.id)}" aria-pressed="${state.shop===s.id}">${esc(s.name)}</button>`).join('')}</div>`:''}
    <button class="go" id="add" type="button">今日のそばを記録</button>
    ${list.length?`<div class="block"><h2>自分の好きな場所</h2><div class="minis">${miniSvg('soba',list)}${miniSvg('tsuyu',list)}</div><p class="note">塗りつぶしは「また来たい」、白抜きはそれ以外です。同じ場所に重なると大きくなります。</p></div>
    <div class="block"><h2>これまでの記録</h2><ul class="list">${list.map(v=>{const s=shopOf(v.shop);return `<li><button class="rec" type="button" data-id="${esc(v.id)}"><span class="d">${esc(md(v.date))}</span><span class="s">${esc(s?s.name:'')}${v.dish?'　'+esc(v.dish):''}</span><span class="r${v.again===2?' yes':''}">${v.again==null?'':AGAIN[v.again]}</span><span class="b">そば：${esc(say(v.soba,'soba'))}<br>つゆ：${esc(say(v.tsuyu,'tsuyu'))}${v.origin?'<br>産地：'+esc(v.origin.name):''}</span></button></li>`;}).join('')}</ul></div>`
    :'<p class="note">まだ記録がありません。お店で食べたら、最初の一枚を記録してみましょう。</p>'}`;
  $('add').onclick=()=>openForm({});
  if($('frontInfo'))$('frontInfo').onclick=()=>{const id=state.shop;state.tab='mise';drawTabs();drawMise(id);$('pane').scrollTop=0;};
  $('view').querySelectorAll('#fil button').forEach(b=>b.onclick=()=>{state.shop=b.dataset.k||null;render();focusShop();});
  $('view').querySelectorAll('.rec').forEach(b=>b.onclick=()=>pickVisit(b.dataset.id));
}
function focusShop(){
  if(!ready)return;
  const s=state.shop&&shopOf(state.shop);
  mapSync();
  if(s&&s.p)map.flyTo({center:s.p,zoom:homeZoom()+6,pitch:0,bearing:0,duration:1500,essential:!calm});
  else map.flyTo({center:HOME,zoom:homeZoom(),pitch:0,bearing:0,duration:1500,essential:!calm});
}
function pickVisit(id){state.visit=id;render();$('pane').scrollTop=0;const v=visitOf(id);if(v&&ends(v))fly(v);}
function leaveVisit(){state.visit=null;goHome();}
function drawVisit(){
  const v=visitOf(state.visit),s=shopOf(v.shop),prev=lastAt(v.shop,v.id,v.date),e=ends(v);
  let price=v.price?v.price.toLocaleString()+'円':'';
  if(v.price&&prev&&prev.price&&prev.price!==v.price)price+=`（前回より${v.price>prev.price?'+':'−'}${Math.abs(v.price-prev.price).toLocaleString()}円）`;
  const rows=[['日付',md(v.date)],['食べたもの',v.dish],['値段',price],['産地',v.origin?v.origin.name+(v.origin.place?'（'+v.origin.place+'）':''):'わからない'],['そば',say(v.soba,'soba')],['つゆ',say(v.tsuyu,'tsuyu')],['次の気持ち',v.again==null?'':AGAIN[v.again]],['言葉',(v.words||[]).join('、')]].filter(r=>r[1]);
  $('view').innerHTML=`
    <button class="link" id="back" type="button">一覧に戻る</button>
    <h2>${esc(s?s.name:'')}</h2>
    <dl class="dl">${rows.map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>
    ${v.memo?`<p>${esc(v.memo).replace(/\n/g,'<br>')}</p>`:''}
    ${v.soba||v.tsuyu?`<div class="minis">${miniSvg('soba',[v],true)}${miniSvg('tsuyu',[v],true)}</div>`:''}
    ${e?'<button class="sub" id="again" type="button">産地から店へ飛ぶ</button>':`<p class="note">${v.origin?'お店の場所を地図で指定すると、産地から店へ飛べます。':'産地を入れてお店の場所を指定すると、産地から店へ飛べます。'}</p>`}
    <div class="row"><button class="sub" id="edit" type="button">直す</button><button class="link" id="del" type="button">この記録を消す</button></div>`;
  $('back').onclick=()=>{leaveVisit();render();};
  if(e)$('again').onclick=()=>fly(v);
  $('edit').onclick=()=>openForm({edit:v});
  let armed=false;
  $('del').onclick=async()=>{if(!armed){armed=true;$('del').textContent='もう一度押すと消します';return;}await remove('visits',v.id);leaveVisit();mapSync();render();};
}

/* ---------- 味の記録 ---------- */
function openForm({edit}){
  const lastShop=[...D.visits].sort(byDate)[0]?.shop;
  const f=edit?JSON.parse(JSON.stringify(edit)):{shop:state.shop||lastShop||(D.shops[0]&&D.shops[0].id)||null,date:today(),dish:'もり',origin:null,soba:null,tsuyu:null,again:null,words:[],price:null,memo:''};
  if(!edit&&f.shop){const p=lastAt(f.shop);if(p&&p.origin)f.origin=p.origin;}
  const L=$('layer1');
  L.innerHTML=`<div class="over"><header><h2>${edit?'記録を直す':'今日のそば'}</h2><button id="fClose" type="button">閉じる</button></header><div class="scroll"><div class="view">
    <div class="block"><span class="t">お店</span><div class="chips" id="fShops"></div></div>
    <div class="block"><div class="pads" id="fPads"></div><p class="note" id="fGhost"></p></div>
    <div class="block"><span class="t">次の気持ち</span><div class="seg" id="fAgain"></div></div>
    <div class="block"><span class="t">食べたもの</span><div class="chips" id="fDish"></div></div>
    <div class="block"><span class="t">産地（わからなければそのままで大丈夫です）</span><div class="chips" id="fOrg"></div></div>
    <details><summary>言葉やその日の様子を足す（書かなくても大丈夫です）</summary><div class="wgroups" id="fWords"></div></details>
    <details><summary>日付、値段、メモ（今日の日付が入っています）</summary><div class="block"><label class="t" for="fDate">日付</label><input type="date" id="fDate" value="${esc(f.date)}"><label class="t" for="fPrice">値段（円）</label><input type="number" inputmode="numeric" id="fPrice" value="${f.price||''}"><label class="t" for="fMemo">メモ</label><textarea id="fMemo" rows="3">${esc(f.memo)}</textarea></div></details>
  </div></div><footer><p class="err" id="fErr" hidden></p><button class="go" id="fSave" type="button">記録する</button></footer></div>`;
  const shopsDraw=()=>{
    const sh=[...D.shops].sort((a,b)=>a.at-b.at);
    $('fShops').innerHTML=sh.map(s=>`<button type="button" class="chip" aria-pressed="${f.shop===s.id}" data-id="${esc(s.id)}">${esc(s.name)}</button>`).join('')+'<button type="button" class="chip" id="fNew">＋ 新しいお店</button>';
    $('fShops').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{f.shop=b.dataset.id;shopsDraw();paint();});
    $('fNew').onclick=()=>openShop(null,s=>{f.shop=s.id;shopsDraw();paint();});
  };
  const dishDraw=()=>{$('fDish').innerHTML=DISHES.map(d=>`<button type="button" class="chip" aria-pressed="${f.dish===d}" data-d="${d}">${d}</button>`).join('');$('fDish').querySelectorAll('button').forEach(b=>b.onclick=()=>{f.dish=f.dish===b.dataset.d?'':b.dataset.d;dishDraw();});};
  let orgMore=false;
  const orgDraw=()=>{
    const cur=f.origin&&f.origin.name,custom=f.origin&&!ORIGIN_DICT.some(o=>o.name===cur);
    const wide=orgMore||ORIGIN_DICT.findIndex(o=>o.name===cur)>=ORIGIN_FIRST,shown=wide?ORIGIN_DICT:ORIGIN_DICT.slice(0,ORIGIN_FIRST);
    $('fOrg').innerHTML=`<button type="button" class="chip" aria-pressed="${!f.origin}" data-o="">わからない</button>`+shown.map(o=>`<button type="button" class="chip" aria-pressed="${cur===o.name}" data-o="${o.name}">${o.name}</button>`).join('')+(custom?`<button type="button" class="chip" aria-pressed="true" data-keep="1">${esc(cur)}</button>`:'')+(wide?'':'<button type="button" class="chip" id="fOrgMore">ほかの産地</button>')+'<button type="button" class="chip" id="fOrgPick">地図で指定</button>';
    if($('fOrgMore'))$('fOrgMore').onclick=()=>{orgMore=true;orgDraw();};
    $('fOrg').querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const o=ORIGIN_DICT.find(x=>x.name===b.dataset.o);f.origin=o?{name:o.name,place:o.place,p:o.p}:null;orgDraw();});
    $('fOrgPick').onclick=async()=>{
      const p=await pick({title:'産地の場所を指定',center:(f.origin&&f.origin.p)||HOME,zoom:f.origin?10:5});
      if(p===undefined){showFormErr('地図を読み込めていません。通信できる場所で指定してください。');return;}
      if(p)openOriginName(p,o=>{f.origin=o;orgDraw();});
    };
  };
  function showFormErr(t){$('fErr').hidden=false;$('fErr').textContent=t;}
  const againDraw=()=>{$('fAgain').innerHTML=AGAIN.map((t,i)=>`<button type="button" aria-pressed="${f.again===i}" data-i="${i}">${t}</button>`).join('');$('fAgain').querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;f.again=f.again===i?null:i;againDraw();});};
  const wordsDraw=()=>{$('fWords').innerHTML=WORDS.map(g=>`<div><p class="t">${g.t}</p><div class="chips">${g.w.map(w=>`<button class="chip" type="button" data-w="${w}" aria-pressed="${f.words.includes(w)}">${w}</button>`).join('')}</div></div>`).join('');$('fWords').querySelectorAll('button').forEach(b=>b.onclick=()=>{const w=b.dataset.w;f.words=f.words.includes(w)?f.words.filter(x=>x!==w):[...f.words,w];wordsDraw();});};
  function buildPad(k){
    const a=AXIS[k];let dots='';
    for(let i=0;i<5;i++)for(let j=0;j<5;j++)dots+=`<circle class="dot" cx="${10+20*i}" cy="${10+20*j}" r="1.3"/>`;
    const box=document.createElement('div');box.className='padbox '+k;
    box.innerHTML=`<p class="padname">${a.name}</p><div class="ax up">${a.up}</div><svg class="pad" id="pad-${k}" viewBox="0 0 100 100" tabindex="0" role="slider" aria-label="${a.name}の味" aria-valuetext="未入力"><line class="mid" x1="50" y1="0" x2="50" y2="100"/><line class="mid" x1="0" y1="50" x2="100" y2="50"/>${dots}<circle class="ghost" id="ghost-${k}" r="8" style="display:none"/><g class="mark" id="mark-${k}" style="display:none"><circle r="9"/></g></svg><div class="ax low"><span>${a.low[0]}</span><span>${a.low[1]}</span><span>${a.low[2]}</span></div><p class="read none" id="read-${k}"></p>`;
    $('fPads').appendChild(box);
    const pad=box.querySelector('svg');
    const place=e=>{const r=pad.getBoundingClientRect();f[k]=[clamp(Math.floor((e.clientX-r.left)/r.width*5),0,4),clamp(4-Math.floor((e.clientY-r.top)/r.height*5),0,4)];paintPad(k);};
    pad.addEventListener('pointerdown',e=>{e.preventDefault();pad.focus({preventScroll:true});try{pad.setPointerCapture(e.pointerId);}catch(x){}place(e);});
    pad.addEventListener('pointermove',e=>{if(pad.hasPointerCapture&&pad.hasPointerCapture(e.pointerId))place(e);});
    pad.addEventListener('keydown',e=>{const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,1],ArrowDown:[0,-1]}[e.key];if(!d)return;e.preventDefault();f[k]=f[k]?[clamp(f[k][0]+d[0],0,4),clamp(f[k][1]+d[1],0,4)]:[2,2];paintPad(k);});
  }
  function paintPad(k){
    const v=f[k],m=$('mark-'+k),rd=$('read-'+k),pad=$('pad-'+k);
    if(v){m.style.display='';m.style.transform=`translate(${px(v)}px,${py(v)}px)`;}else m.style.display='none';
    rd.textContent=v?say(v,k):'押して入れます';rd.classList.toggle('none',!v);
    pad.setAttribute('aria-valuetext',v?say(v,k):'未入力');
    const l=f.shop?lastAt(f.shop,edit&&edit.id):null,g=$('ghost-'+k),gv=l&&l[k];
    if(gv){g.style.display='';g.setAttribute('cx',px(gv));g.setAttribute('cy',py(gv));}else g.style.display='none';
  }
  function paint(){paintPad('soba');paintPad('tsuyu');const l=f.shop?lastAt(f.shop,edit&&edit.id):null;$('fGhost').textContent=l?`点線の輪は、このお店の前回（${md(l.date)}）です。`:'';}
  $('fClose').onclick=()=>{L.innerHTML='';};
  buildPad('soba');buildPad('tsuyu');shopsDraw();dishDraw();orgDraw();againDraw();wordsDraw();paint();
  $('fSave').onclick=async()=>{
    if(!f.shop){showFormErr('お店を選んでください。');return;}
    if(!f.soba&&!f.tsuyu&&f.again===null){showFormErr('そば、つゆ、次の気持ちのどれかを入れてください。');return;}
    const price=parseInt($('fPrice').value,10);
    const rec={...f,id:(edit&&edit.id)||uid(),at:(edit&&edit.at)||Date.now(),date:$('fDate').value||today(),price:price>0?price:null,memo:$('fMemo').value.trim()};
    try{await save('visits',rec);}catch(e){showFormErr('保存できませんでした。ブラウザの設定を確認してください。');return;}
    L.innerHTML='';mapSync();state.tab='rec';pickVisit(rec.id);
  };
}
function openOriginName(p,done){
  const L=$('layer2');
  L.innerHTML=`<div class="over"><header><h2>産地の名前</h2><button id="nClose" type="button">閉じる</button></header><div class="scroll"><div class="view"><div class="block"><label class="t" for="nName">産地や品種の名前</label><input type="text" id="nName" autocomplete="off"><p class="err" id="nErr" hidden></p></div></div></div><footer><button class="go" id="nSave" type="button">決める</button></footer></div>`;
  $('nClose').onclick=()=>{L.innerHTML='';};
  $('nSave').onclick=()=>{const n=$('nName').value.trim();if(!n){$('nErr').hidden=false;$('nErr').textContent='名前を入れてください。';return;}L.innerHTML='';done({name:n,place:'',p});};
  setTimeout(()=>$('nName').focus(),50);
}

/* ---------- お店 ---------- */
function openShop(shop,onDone){
  const d=shop?{...shop}:{name:'',area:'',p:null,memo:''};
  const L=$('layer2');
  const used=shop&&D.visits.some(v=>v.shop===shop.id);
  L.innerHTML=`<div class="over"><header><h2>${shop?'お店を直す':'お店を追加'}</h2><button id="sClose" type="button">閉じる</button></header><div class="scroll"><div class="view">
    <div class="block"><label class="t" for="sName">お店の名前</label><input type="text" id="sName" value="${esc(d.name)}" autocomplete="off"></div>
    <div class="block"><label class="t" for="sArea">地域（市区町村まで）</label><input type="text" id="sArea" value="${esc(d.area)}" autocomplete="off"></div>
    <div class="block"><span class="t">場所</span><button class="sub" id="sPick" type="button">${d.p?'場所を指定し直す':'地図で場所を指定する'}</button><p class="note" id="sP"></p></div>
    <div class="block"><label class="t" for="sMemo">メモ</label><textarea id="sMemo" rows="2">${esc(d.memo)}</textarea></div>
    ${shop&&!used?'<button class="link" id="sDel" type="button">このお店を消す</button>':''}
  </div></div><footer><p class="err" id="sErr" hidden></p><button class="go" id="sSave" type="button">お店を保存</button></footer></div>`;
  const pText=()=>{$('sP').textContent=d.p?'場所を指定しました。':'場所を指定しないと地図には出ません。あとからでも指定できます。';};pText();
  const close=()=>{L.innerHTML='';};
  const err=t=>{$('sErr').hidden=false;$('sErr').textContent=t;};
  $('sClose').onclick=close;
  $('sPick').onclick=async()=>{
    const last=D.shops.filter(s=>s.p).slice(-1)[0];
    const p=await pick({title:'お店の場所を指定',center:d.p||(last&&last.p)||HOME,zoom:d.p?15:(last?11:5),geo:true});
    if(p===undefined){err('地図を読み込めていません。通信できる場所で指定してください。');return;}
    if(p){d.p=p;$('sPick').textContent='場所を指定し直す';pText();}
  };
  $('sSave').onclick=async()=>{
    const name=$('sName').value.trim();
    if(!name){err('お店の名前を入れてください。');$('sName').focus();return;}
    const o={...(shop||{web:[],mine:{}}),id:(shop&&shop.id)||uid(),at:(shop&&shop.at)||Date.now(),name,area:$('sArea').value.trim(),p:d.p,memo:$('sMemo').value.trim()};
    try{await save('shops',o);}catch(e){err('保存できませんでした。ブラウザの設定を確認してください。');return;}
    close();mapSync();if(!$('layer1').innerHTML)render();onDone&&onDone(o);
  };
  if($('sDel')){let armed=false;$('sDel').onclick=async()=>{if(!armed){armed=true;$('sDel').textContent='もう一度押すと消します';return;}await remove('shops',shop.id);if(state.shop===shop.id)state.shop=null;close();mapSync();render();};}
  if(!shop)setTimeout(()=>$('sName').focus(),50);
}
function makePrompt(name,area){
  return `次のそば店について、Webで調べてください。

店名：${name}
地域：${area}

調べる項目：${ITEMS}

守ること：
・同じ名前の別の店と混ざらないよう、地域を確かめてください。
・ページに書かれていることだけを書き、推測で埋めないでください。
・わからない項目は、項目ごと省いてください。

function parseResult(txt){
  const a=txt.indexOf('{'),b=txt.lastIndexOf('}');
  if(a<0||b<=a)throw 0;
  const o=JSON.parse(txt.slice(a,b+1));
  if(!o||!Array.isArray(o['項目']))throw 0;
  const items=o['項目'].filter(x=>x&&x['名前']&&x['内容']).map(x=>({n:String(x['名前']),v:String(x['内容']),src:okUrl(x['出典'])?String(x['出典']):''}));
  if(!items.length)throw 0;
  return {name:String(o['店名']||''),area:String(o['地域']||''),items};
}

/* ---------- 地図：計算 ---------- */
const R=Math.PI/180,K=25000;
function gcKm(a,b){const p1=a[1]*R,p2=b[1]*R,dp=p2-p1,dl=(b[0]-a[0])*R,h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*6371*Math.asin(Math.sqrt(h));}
function brg(a,b){const p1=a[1]*R,p2=b[1]*R,dl=(b[0]-a[0])*R;return Math.atan2(Math.sin(dl)*Math.cos(p2),Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl))/R;}
function bowLine(a,b){
  const S=gcKm(a,b),n=Math.max(60,Math.ceil(S/3)),h=brg(a,b)*R,pts=[];
  for(let i=0;i<=n;i++){const t=i/n,off=S*.05*Math.sin(Math.PI*t),lat=a[1]+(b[1]-a[1])*t;pts.push([a[0]+(b[0]-a[0])*t+off*Math.cos(h)/(111*Math.cos(lat*R)),lat-off*Math.sin(h)/111]);}
  return pts;
}
function makeRoute(a,b){
  const pts=bowLine(a,b),cum=[0];
  for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+gcKm(pts[i-1],pts[i]));
  const S=cum[cum.length-1];
  const idx=x=>{let lo=0,hi=pts.length-1;while(hi-lo>1){const m=(lo+hi)>>1;cum[m]<=x?lo=m:hi=m;}return lo;};
  const pos=x=>{x=clamp(x,0,S);const i=idx(x),u=(x-cum[i])/Math.max(1e-9,cum[i+1]-cum[i]);return [pts[i][0]+(pts[i+1][0]-pts[i][0])*u,pts[i][1]+(pts[i+1][1]-pts[i][1])*u];};
  const heading=x=>{const d=Math.max(2,S*.02);return brg(pos(x-d),pos(x+d));};
  return {pts,S,pos,heading};
}
function makePlan(S){
  const zc=clamp(11.6-Math.log2(S/100),7.4,11.2),W=z=>K/2**z,wc=W(zc),w0=W(CAM.farm),ws=W(CAM.shop);
  /* 上昇から水平へ移るところで角が立たないよう、なめらかに最小をとる */
  const width=x=>{const q=4,c=w0+CAM.slope*x,d=ws+CAM.slope*Math.max(0,S-x);return (wc**-q+c**-q+d**-q)**(-1/q);};
  const N=1400,dist=[],time=[0];
  for(let i=0;i<=N;i++){const v=i/N;dist.push(S*(v<.5?.5*(2*v)**5:1-.5*(2*(1-v))**5));}
  for(let i=1;i<=N;i++)time.push(time[i-1]+(dist[i]-dist[i-1])*(1/width(dist[i])+1/width(dist[i-1]))/2);
  const T=time[N];
  return {S,zc,duration:clamp(7000+S*9,8000,15000),at(u){
    const target=u*T;let lo=0,hi=N;
    while(hi-lo>1){const m=(lo+hi)>>1;time[m]<=target?lo=m:hi=m;}
    const x=dist[lo]+(dist[hi]-dist[lo])*((target-time[lo])/Math.max(1e-9,time[hi]-time[lo]));
    return {x,zoom:Math.log2(K/width(x))};
  }};
}
const endSoft=(t,e)=>t<1-e?t/(1-e/2):1-(1-t)**2/(e*(2-e));
const easeIn=t=>endSoft(t,.05)**2.4;
const bothEnds=(t,e)=>t<e?t*t/(2*e*(1-e)):t<1-e?(t-e/2)/(1-e):1-(1-t)**2/(2*e*(1-e));
const flightTime=t=>{const s=bothEnds(t,.04);return clamp(s+CAM.swing*Math.sin(2*Math.PI*s)/(2*Math.PI),0,1);};

const fc=f=>({type:'FeatureCollection',features:f});
const lineF=(c,props)=>({type:'Feature',geometry:{type:'LineString',coordinates:c},properties:props||{}});
const ptF=(p,props)=>({type:'Feature',geometry:{type:'Point',coordinates:p},properties:props||{}});
function homeZoom(){const c=map.getContainer(),s=Math.max(160,Math.min(c.clientWidth,c.clientHeight));return Math.log2(32000*s/(512*1500));}
function showMapMsg(t){$('mapMsg').hidden=false;$('mapMsg').textContent=t;}
function tint(){
  for(const l of map.getStyle().layers){
    const id=l.id,set=(p,v)=>{try{map.setPaintProperty(id,p,v);}catch(e){}};
    if(l.type==='background')set('background-color',COL.land);
    else if(l.type==='fill'){if(/water/.test(id))set('fill-color',COL.sea);else if(/hillshade/.test(id))set('fill-opacity',0);else set('fill-color',COL.land2);}
    else if(l.type==='line'){if(/water/.test(id))set('line-color',COL.sea);else if(!/admin/.test(id))set('line-color',COL.road);}
    else if(l.type==='symbol'){try{const tf=map.getLayoutProperty(id,'text-field');if(JSON.stringify(tf||'').includes('name'))map.setLayoutProperty(id,'text-field',['coalesce',['get','name_ja'],['get','name']]);}catch(e){}}
  }
}
function satOn(on){if(!ready)return;map.setLayoutProperty('sat','visibility',on?'visible':'none');map.setPaintProperty('sat','raster-opacity',on?1:0);}

}

    el.innerHTML=SEED_SVG;$('seedFix').innerHTML=SEED_SVG;
    marker=new mapboxgl.Marker({element:el,rotationAlignment:'viewport',pitchAlignment:'viewport'});
    ready=true;$('mapMsg').hidden=true;mapSync();
    if(state.visit){const v=visitOf(state.visit);if(v&&ends(v))fly(v);}
  });
  addEventListener('resize',()=>map.resize());
}
const SEED_SVG='<svg viewBox="0 0 100 100" width="28" height="28"><path d="M50 10C60 28 81 55 83 70C84 83 72 89 50 89C28 89 16 83 17 70C19 55 40 28 50 10Z" fill="#33241B" stroke="#FBFCFA" stroke-width="6" stroke-linejoin="round"/><path d="M50 10C60 28 81 55 83 70C84 83 72 89 50 89C48 89 46 89 44 89C43 62 46 34 50 10Z" fill="#6B5240"/></svg>';
const trim=v=>{map.setPaintProperty('hl','line-trim-offset',v);map.setPaintProperty('hl-case','line-trim-offset',v);};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function idle(ms){return new Promise(res=>{const on=()=>{clearTimeout(t);res();};map.once('idle',on);const t=setTimeout(()=>{map.off('idle',on);res();},ms);});}
function frames(dur,fn,my){return new Promise(res=>{const t0=performance.now();(function tick(now){if(my!==run)return res();const p=clamp((now-t0)/dur,0,1);fn(p);p<1?requestAnimationFrame(tick):res();})(t0);});}
function setFlying(on,now){document.body.classList.toggle('flying',on);document.body.classList.toggle('flyingNow',!!now);if(map)map.resize();}
function goHome(){
  run++;$('float').hidden=true;$('seedFix').hidden=true;setFlying(false,false);
  if(!ready)return;
  marker.remove();map.getSource('hl').setData(fc([]));satOn(false);
  map.flyTo({center:HOME,zoom:homeZoom(),pitch:0,bearing:0,duration:calm?0:1400,essential:!calm});
}
/* カメラの高さを自分で決める。地形が変わってもカメラは上下しない */
const FOV=.6435011087932844;
const camD=zoom=>.5*map.getContainer().clientHeight/Math.tan(FOV/2)/(512*2**zoom);
function setFree(pos,zoom,pitch,bearing,g){
  const cam=map.getFreeCameraOptions(),mc=mapboxgl.MercatorCoordinate.fromLngLat(pos,0),unit=mc.meterInMercatorCoordinateUnits(),d=camD(zoom),b=bearing*R,q=pitch*R;
  cam.position=new mapboxgl.MercatorCoordinate(mc.x-Math.sin(b)*d*Math.sin(q),mc.y+Math.cos(b)*d*Math.sin(q),g*unit+d*Math.cos(q));
  cam.setPitchBearing(pitch,bearing);
  map.setFreeCameraOptions(cam);
}
/* 列島→産地→山を越えて→店。カメラの数値は試作で決めたもの */
async function fly(v){
  if(!ready)return;
  const en=ends(v);if(!en)return;
  const [op,sp]=en,my=++run,r=makeRoute(op,sp),plan=makePlan(r.S),c=r.pts,last=c.length-1;
  const startB=r.heading(0),endB=r.heading(r.S);
  const cm=[0],mercY=la=>Math.log(Math.tan(Math.PI/4+la*R/2))/(2*Math.PI);
  for(let i=1;i<=last;i++)cm.push(cm[i-1]+Math.hypot((c[i][0]-c[i-1][0])/360,mercY(c[i][1])-mercY(c[i-1][1])));
  const trimAt=x=>{const f=clamp(x/r.S,0,1)*last,i=Math.min(last-1,Math.floor(f)),u=f-i;return clamp((cm[i]+(cm[i+1]-cm[i])*u)/cm[last],.00001,.99999);};
  const line=fc([lineF(c)]);
  $('float').hidden=true;$('mapCard').hidden=true;setFlying(true,true);
  map.getSource('hl').setData(fc([]));
  marker.setLngLat(op).addTo(map);
  const finish=()=>{setFlying(true,false);$('float').hidden=false;};
  if(calm){map.getSource('hl').setData(line);trim([0,0]);marker.setLngLat(sp);map.jumpTo({center:sp,zoom:CAM.shop,pitch:0,bearing:0});finish();return;}
  const start=homeZoom();
  map.jumpTo({center:HOME,zoom:start,pitch:0,bearing:0});satOn(true);
  try{map.easeTo({center:op,zoom:CAM.farm,pitch:CAM.pitchEnd,bearing:startB,duration:1,preloadOnly:true});map.easeTo({center:sp,zoom:CAM.shop,pitch:CAM.pitchEnd,bearing:endB,duration:1,preloadOnly:true});[.2,.35,.5,.65,.8].forEach(f=>{const x=r.S*f;map.easeTo({center:r.pos(x),zoom:plan.zc,pitch:CAM.pitchCruise,bearing:r.heading(x),duration:1,preloadOnly:true});});}catch(e){}
  await frames(CAM.approach,p=>{
    const zoom=start+(CAM.farm-start)*easeIn(p),m=smooth(0,.62,p),k=smooth(start+3,CAM.farm-1,zoom);
    map.jumpTo({center:[HOME[0]+(op[0]-HOME[0])*m,HOME[1]+(op[1]-HOME[1])*m],zoom,pitch:CAM.pitchEnd*k,bearing:startB*smooth(.1,.98,p)});
  },my);
  if(my!==run)return;
  await sleep(CAM.hold);await idle(1800);if(my!==run)return;
  map.getSource('hl').setData(line);trim([.00001,1]);
  /* 飛び始めの基準の高さは今のカメラから取り、店に近づくにつれて店の地面の高さへゆっくり移す */
  const u0=mapboxgl.MercatorCoordinate.fromLngLat(op,0).meterInMercatorCoordinateUnits();
  let gNow=(map.getFreeCameraOptions().position.z-camD(CAM.farm)*Math.cos(CAM.pitchEnd*R))/u0;
  let gKnown=null;
  marker.remove();$('seedFix').hidden=false;
  await frames(plan.duration,p=>{
    const {x,zoom}=plan.at(flightTime(p)),pos=r.pos(x),lv=1-smooth(plan.zc,plan.zc+2.2,zoom),t=x/r.S;
    trim([trimAt(x),1]);
    if(t>.4){
      const e=map.queryTerrainElevation(sp);if(e!==null&&e!==undefined)gKnown=e;const goal=gKnown===null?(t>.6?30:gNow):gKnown;
      gNow+=(goal-gNow)*(.015*smooth(.4,.6,t)+.2*smooth(.88,1,t));
    }
    setFree(pos,zoom,CAM.pitchEnd+(CAM.pitchCruise-CAM.pitchEnd)*lv,r.heading(x),gNow);
  },my);
  $('seedFix').hidden=true;
  if(my!==run)return;
  trim([0,0]);marker.setLngLat(sp).addTo(map);finish();
}
$('float').onclick=()=>{goHome();};

/* ---------- 地図で場所を指定 ---------- */
function pick({title,center,zoom,geo}){
  return new Promise(res=>{
    if(!ready)return res(undefined);
    run++;$('seedFix').hidden=true;marker.remove();map.getSource('hl').setData(fc([]));satOn(false);
    state.picking=true;$('float').hidden=true;
    $('layer1').hidden=$('layer2').hidden=true;
    document.body.classList.add('picking');document.body.classList.remove('flying','flyingNow');map.resize();
    $('cross').hidden=false;
    map.flyTo({center,zoom,pitch:0,bearing:0,duration:1200,essential:true});
    const bar=$('pickBar');bar.hidden=false;
    bar.innerHTML=`<b>${esc(title)}</b><div class="note">地図を動かして、十字を場所に合わせてください。二本指で拡大できます。</div><div class="row">${geo?'<button class="sub" id="pGeo" type="button">今いる場所を使う</button>':''}<button class="sub" id="pOk" type="button">ここに決める</button><button class="link" id="pNo" type="button">やめる</button></div><p class="err" id="pErr" hidden></p>`;
    const done=p=>{
      bar.hidden=true;$('cross').hidden=true;$('layer1').hidden=$('layer2').hidden=false;state.picking=false;
      document.body.classList.remove('picking');map.resize();res(p);
    };
    $('pOk').onclick=()=>{const c=map.getCenter().wrap();done([+c.lng.toFixed(5),+c.lat.toFixed(5)]);};
    $('pNo').onclick=()=>done(null);
    if(geo)$('pGeo').onclick=()=>{
      const err=t=>{$('pErr').hidden=false;$('pErr').textContent=t;};
      if(!navigator.geolocation)return err('この端末では現在地を使えません。地図で合わせてください。');
      navigator.geolocation.getCurrentPosition(g=>map.flyTo({center:[g.coords.longitude,g.coords.latitude],zoom:16.5,duration:1200,essential:true}),()=>err('現在地を取得できませんでした。地図で合わせてください。'),{enableHighAccuracy:true,timeout:9000});
    };
  });
}

/* ---------- 起動 ---------- */
function loadMap(){
  const fail=()=>{if(!ready)showMapMsg('地図は通信できるときに表示されます。記録はこのまま使えます。');};
  const css=document.createElement('link');css.rel='stylesheet';css.href=MB+'/mapbox-gl.css';document.head.append(css);
  const sc=document.createElement('script');sc.src=MB+'/mapbox-gl.js';sc.onload=initMap;sc.onerror=fail;document.head.append(sc);
  setTimeout(fail,10000);
}
(async()=>{
  try{await openDB();await dbLoad();}
  catch(e){showMapMsg('この端末では記録を保存できません。ブラウザの設定を確認してください。');}
  render();loadMap();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{});
})();
</script>
